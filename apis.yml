aid: carswitch
name: CarSwitch
description: >-
  CarSwitch is a tech-enabled used-car marketplace founded in Dubai in 2016 that
  facilitates buying and selling of pre-owned vehicles across the United Arab
  Emirates (Dubai, Abu Dhabi and nationwide) and Saudi Arabia. Rather than a
  traditional classifieds site, CarSwitch operates as a fully managed service:
  every car undergoes a 200-point inspection before listing, sellers get an
  end-to-end managed selling service (professional photography, listing,
  negotiation and RTA transfer handling), and buyers get price transparency, a
  free online car-valuation tool and installment financing through banking
  partners such as Emirates NBD, FAB, ADCB, ADIB, DIB and Emirates Islamic. The
  company has inspected 130,000+ vehicles and facilitated over $500 million in
  sales. CarSwitch was surfaced as a portfolio company of 500 Global and added
  to the API Evangelist network; it is a consumer marketplace with no public
  developer API program.
